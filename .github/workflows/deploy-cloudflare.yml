# Companion Atlas — deploy to Cloudflare (prod).
#
# Builds the viewer-react production bundle and deploys the single Worker
# (server/wrangler.toml, name "ci-atlas-prod") that serves it as static
# assets plus the REST API surface (server/src/worker.ts) at /api/*. See
# server/wrangler.toml's header comment for what this deployment does and
# does not cover.
#
# Requires repository secrets that this workflow does not create:
#   CLOUDFLARE_API_TOKEN    a token with Workers Scripts:Edit, D1:Edit,
#                           Workers R2 Storage:Edit for this account, plus
#                           access to the ci.computer zone so the
#                           atlas.ci.computer custom domain can attach
#   CLOUDFLARE_ACCOUNT_ID
#   CI_COMMON_ACCESS_TOKEN  a PAT (fine-grained, scoped to just this repo +
#                           companionintelligence/CI-Common, Contents:Read
#                           on both) — the default GITHUB_TOKEN cannot fetch
#                           the private CI-Common submodule; see the
#                           checkout step below and build.yml's "viewer" job.
#
# Optional build-time secrets, read by viewer-react when it builds. Unset, the
# viewer falls back without them: VITE_CESIUM_ION_TOKEN (World Imagery and
# Terrain) and VITE_GOOGLE_MAPS_API_KEY (3D buildings and Street View).
#
# Runs on workflow_dispatch while the push-to-main trigger is gated off (see
# `on:` below). Once restored, it runs only on push to main, never from a
# feature branch or a fork's pull request, so a deploy happens once a change
# has actually merged.
name: deploy-cloudflare

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

permissions:
  contents: read
  # Same reasoning as build.yml: @companionintelligence/config (and its
  # transitive @companionintelligence/content dep) resolve from GitHub
  # Packages, and an explicit `permissions:` block zeroes out everything not
  # listed, including the packages scope GITHUB_TOKEN would otherwise carry.
  packages: read

concurrency:
  # A second push to main mid-deploy should replace the in-flight deploy,
  # not queue behind it — the site should always end up matching the latest
  # commit, not an intermediate one.
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Build viewer + deploy Worker
    runs-on: ubuntu-latest
    steps:
      # Fail in seconds, before the checkout and build, when a Cloudflare secret
      # is missing. The migrate and deploy steps would fail the same way later.
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?add the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?add the CLOUDFLARE_ACCOUNT_ID repository secret}"

      # `token:` matters here, not just `submodules: true`: GITHUB_TOKEN is
      # scoped to this one repo and cannot fetch the private
      # companionintelligence/CI-Common submodule ("Repository not found").
      # Falls back to GITHUB_TOKEN, unchanged, if CI_COMMON_ACCESS_TOKEN
      # isn't set — see the header comment above for what that secret needs.
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.CI_COMMON_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci`, not `npm install`: deploy exactly what package-lock.json pins, and
      # fail if the lockfile has drifted from package.json instead of re-resolving.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sign-on for the web build (docs/DISCOVERY.md, "Sign-on"). These identify the
      # public client and its redirect, so they are plain values, not secrets. All three
      # are needed together: the viewer shows "Sign in with Companion" only when set.
      - name: Build viewer-react
        run: npm run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_OIDC_ISSUER: https://hub.ci.computer/api/auth
          VITE_OIDC_CLIENT_ID: companion-atlas
          VITE_OIDC_REDIRECT_URI: https://atlas.ci.computer/

      # Schema before code. wrangler records which migrations it has applied, so
      # this is a no-op once the database is current.
      - name: Apply D1 migrations
        working-directory: server
        run: npx wrangler d1 migrations apply ci-atlas-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        working-directory: server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
