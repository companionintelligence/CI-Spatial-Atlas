# Companion Atlas — deploy to Cloudflare (prod).
#
# Builds the viewer-react production bundle and deploys the single Worker
# (server/wrangler.toml, name "ci-atlas-prod") that serves it as static
# assets plus the REST API surface (server/src/worker.ts) at /api/*. See
# server/wrangler.toml's header comment for what this deployment does and
# does not cover.
#
# Requires repository secrets that this workflow does not create:
#   CLOUDFLARE_API_TOKEN    a token with Workers Scripts:Edit, D1:Edit,
#                           Workers R2 Storage:Edit for this account
#   CLOUDFLARE_ACCOUNT_ID
#   CI_COMMON_ACCESS_TOKEN  a PAT (fine-grained, scoped to just this repo +
#                           companionintelligence/CI-Common, Contents:Read
#                           on both) — the default GITHUB_TOKEN cannot fetch
#                           the private CI-Common submodule; see the
#                           checkout step below and build.yml's "viewer" job.
#
# Runs only on push to main — never from a feature branch or a fork's pull
# request — so a deploy happens once a change has actually merged, not on
# every push to an in-review branch.
name: deploy-cloudflare

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

permissions:
  contents: read
  # Same reasoning as build.yml: @companionintelligence/config (and its
  # transitive @companionintelligence/content dep) resolve from GitHub
  # Packages, and an explicit `permissions:` block zeroes out everything not
  # listed, including the packages scope GITHUB_TOKEN would otherwise carry.
  packages: read

concurrency:
  # A second push to main mid-deploy should replace the in-flight deploy,
  # not queue behind it — the site should always end up matching the latest
  # commit, not an intermediate one.
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Build viewer + deploy Worker
    runs-on: ubuntu-latest
    steps:
      # `token:` matters here, not just `submodules: true`: GITHUB_TOKEN is
      # scoped to this one repo and cannot fetch the private
      # companionintelligence/CI-Common submodule ("Repository not found").
      # Falls back to GITHUB_TOKEN, unchanged, if CI_COMMON_ACCESS_TOKEN
      # isn't set — see the header comment above for what that secret needs.
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.CI_COMMON_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build viewer-react
        run: npm run build

      - name: Deploy to Cloudflare
        working-directory: server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
