# Companion Atlas — build verification.
#
# This repository had no `.github/workflows` directory at all, so nothing ever
# proved the viewer or the image could be built. The Dockerfile was in fact
# broken (it ran `npm run textures:build`, which shells out to ImageMagick,
# absent from node:22-alpine), which is why
# ghcr.io/companionintelligence/companion-atlas-viewer — the image
# hub/docker-compose.json tells CI-Hub to pull — was never published.
#
# Scope is deliberately limited to BUILD VERIFICATION:
#   - no registry push
#   - no secrets (nothing here needs a token)
#   - no deployment to any domain
# Publishing the image and wiring a host are separate, reviewed decisions.
name: build

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Canon 1.0 (@companionintelligence/config, and its own transitive dep on
  # @companionintelligence/content) is a real, resolvable dependency now —
  # without this, GITHUB_TOKEN has no packages scope at all (an explicit
  # `permissions:` block zeroes out everything not listed), so every job's
  # `npm install` 403s on any @companionintelligence/* package with
  # "Permission installation not allowed to Read organization package",
  # regardless of the per-package repo grant already configured upstream.
  packages: read

concurrency:
  # push (branches-ignore: [main]) and pull_request both fire for the same
  # commit once a PR is open — github.ref differs between the two events
  # (refs/heads/<branch> vs refs/pull/<n>/merge), so keying on it let both
  # runs proceed independently and build the same commit twice. Key on the
  # commit SHA instead (present under both event names) so the later-starting
  # run's cancel-in-progress actually cancels the earlier one.
  group: build-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  viewer:
    name: Static viewer build
    runs-on: ubuntu-latest
    steps:
      # The vanilla-TS viewer this job was written for (a root-level app with
      # no workspace deps of its own) was removed — viewer-react is now the
      # only viewer, and `npm run build` at the root means story-schema +
      # viewer-react's real `tsc --noEmit && vite build`. That needs the full
      # workspace tree installed, including the @companionintelligence/tokens
      # submodule viewer-react's theme imports.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint design canon (ci-lint-canon from @companionintelligence/config)
        run: npm run lint:canon

      - name: Typecheck and build viewer
        run: npm run build

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          test -f viewer-react/dist/index.html
          # vite-plugin-cesium stages the runtime assets into dist/cesium/ as
          # part of the one `vite build` above — no separate copy step needed.
          # Cesium's Workers/* are content-hashed chunks, so assert on the
          # stable asset paths instead. Without these the default renderer
          # cannot resolve CESIUM_BASE_URL at runtime.
          test -f viewer-react/dist/cesium/Assets/approximateTerrainHeights.json
          test -d viewer-react/dist/cesium/Widgets/CesiumWidget
          test -n "$(ls -A viewer-react/dist/cesium/Workers)"
          echo "dist size: $(du -sh viewer-react/dist | cut -f1), files: $(find viewer-react/dist -type f | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-viewer-dist
          path: viewer-react/dist
          retention-days: 7

  schema:
    name: Story schema build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund --workspace @companion-atlas/story --include-workspace-root
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # packages/story-schema publishes ./dist, but nothing built it, so every
      # consumer of @companion-atlas/story failed to typecheck from a clean tree.
      - name: Build @companion-atlas/story
        run: npm run build --workspace @companion-atlas/story

      - name: Verify emitted types
        run: test -f packages/story-schema/dist/index.d.ts

  viewer-react:
    name: viewer-react — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund --workspace @companion-atlas/viewer-react --workspace @companion-atlas/story --include-workspace-root
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build @companion-atlas/story
        run: npm run build --workspace @companion-atlas/story

      - name: Test
        run: npm test --workspace @companion-atlas/viewer-react

      # The full `npm run build --workspace @companion-atlas/viewer-react`
      # (tsc --noEmit && vite build) is deliberately NOT run here.
      # viewer-react depends on @companionintelligence/tokens, which
      # package-lock.json resolves to `link:../ci-common/packages/tokens` — a
      # path outside this repository, same as the `viewer` job above works
      # around for the root app. Unlike that job, viewer-react's own source
      # (src/theme/index.ts) imports it directly, so there's no way to build
      # or typecheck viewer-react in a single-repo CI checkout today. The
      # tests above don't touch that import and so aren't affected. Add a
      # build/typecheck step here once that dependency is published to a
      # registry this checkout can resolve.

  server:
    name: server — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # server/src/ci-memory-client.ts imports from @companion-atlas/story
      # (not declared in server/package.json — it currently resolves only via
      # npm workspace hoisting), so include it explicitly here too.
      - name: Install
        run: npm install --no-audit --no-fund --workspace server --workspace @companion-atlas/story --include-workspace-root
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build @companion-atlas/story
        run: npm run build --workspace @companion-atlas/story

      - name: Typecheck
        run: npm run typecheck --workspace server

      - name: Test
        run: npm test --workspace server

  image:
    name: Viewer image (build only, no push)
    runs-on: ubuntu-latest
    steps:
      # The Dockerfile this job built moved to viewer-react/Dockerfile when
      # the vanilla-TS viewer (and its root-level Dockerfile) was removed —
      # viewer-react is now the only viewer, and its Dockerfile documents that
      # the build context must stay the repo root (it COPYs
      # packages/story-schema and third_party/ci-common/packages/tokens,
      # resolved via the npm workspace). The submodule checkout is required
      # for that COPY to have real content.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build image
        run: docker build -f viewer-react/Dockerfile -t companion-atlas-viewer:ci .

      # Proves the container actually serves, on the port hub/config.json and
      # hub/docker-compose.json advertise to CI-Hub (8080).
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name atlas-ci -p 18080:8080 companion-atlas-viewer:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>'

          # The SPA fallback returns index.html with HTTP 200 for ANY unknown
          # path, so a bare status check would pass even with the Cesium assets
          # missing entirely. Assert on the content type instead: a real .json
          # file is served as application/json, the HTML fallback is not.
          ctype=$(curl -fsS -o /dev/null -w '%{content_type}' \
            http://127.0.0.1:18080/cesium/Assets/approximateTerrainHeights.json)
          echo "approximateTerrainHeights.json content-type: $ctype"
          case "$ctype" in
            application/json*) ;;
            *) echo "Cesium assets are not being served (got '$ctype')"; exit 1 ;;
          esac

          # SPA fallback: unknown deep links must resolve to index.html.
          curl -fsS http://127.0.0.1:18080/some/deep/link | grep -q '<title>'

          docker rm -f atlas-ci
