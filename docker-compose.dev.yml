# Companion Atlas — LOCAL DEV stack.
#
# Brings up the backing stores + the atlas-api in watch mode, reading env from
# .env.dev (copy .env.dev.example). The React viewer runs on the host for HMR:
#
#   cp .env.dev.example .env.dev          # then edit for connected vs mock mode
#   docker compose -f docker-compose.dev.yml up postgres redis minio atlas-api
#   (in another shell)  cd viewer-react && npm install && npm run dev
#     (or, under Deno: cd viewer-react && deno task dev)
#
# Two modes (see .env.dev.example):
#   MOCK (default)      COMPANION_OIDC_ISSUER + CI_MEMORY_URL empty → auth runs as
#                       a dev subject, memory returns nothing. Zero external deps.
#   CONNECTED           Point at a running CI-Portal + CI-Server (local or tailnet).
services:
  atlas-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ['deno', 'task', 'dev']
    env_file: [.env.dev]
    environment:
      PORT: '8787'
      # This image is built from server/Dockerfile, whose runtime stage sets
      # NODE_ENV=production — so in MOCK mode (no COMPANION_OIDC_ISSUER) the
      # startup guard in server/src/auth.ts would refuse to boot. Opt in
      # explicitly: this is a developer machine, not a deployment.
      ATLAS_ALLOW_DEV_AUTH: '1'
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: atlas
    volumes:
      - ./server:/app/server
      - ./packages:/app/packages
    ports:
      - '8787:8787'
    depends_on: [postgres, redis, minio]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports: ['5432:5432']
    volumes: [pg-dev:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-dev:/data]

volumes:
  pg-dev:
  minio-dev:
