# Companion Atlas — containerized 3D processing server + web viewer.
#
#   viewer     the viewer (Resium/CesiumJS + R3F/WebXR, ADR-0001), with live
#              Companion Memory + Places integration — built from
#              viewer-react/Dockerfile
#   atlas-api  3D processing API + MCP server (REST + /mcp)
#   worker     GPU reconstruction worker (photogrammetry / gaussian splat)
#   minio      S3-compatible object store for media + generated 3D Tiles
#   postgres   story / scene / media metadata
#   redis      job queue (ingest → reconstruct → tile)
#
# Bring up the app tier (viewer + api + stores):
#   docker compose up viewer atlas-api minio postgres redis
# The viewer can also run alone, talking directly to an external CI-Server with
# no atlas-api dependency — set VITE_MEMORY_URL:
#   docker compose up viewer
# Add reconstruction (needs an NVIDIA GPU):
#   docker compose --profile gpu up worker

services:
  viewer:
    build:
      context: .
      dockerfile: viewer-react/Dockerfile
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_MEMORY_URL: ${VITE_MEMORY_URL:-}
        VITE_MEMORY_TOKEN: ${VITE_MEMORY_TOKEN:-}
        VITE_MEMORY_API_KEY: ${VITE_MEMORY_API_KEY:-}
        # Terrain heights without an account. Cesium reads exactly one terrain
        # wire format (quantized-mesh-1.0) and nobody publishes a free global
        # service in it, so the keyless route is necessarily "point at a
        # tileset you built and host yourself" — which only works if the URL
        # can reach a build. Vite inlines VITE_* at BUILD time, so for a
        # container this has to be a build arg: setting it in `environment:`
        # on the runtime service would change nothing, the bundle is already
        # compiled. `VITE_TERRAIN_CREDIT` is not defaulted on purpose — every
        # free global DEM worth tiling (Copernicus certainly) requires its own
        # attribution, and only the operator knows which DEM they tiled.
        # See viewer-react/src/renderers/terrain.ts for what the tileset must
        # satisfy, including the EGM2008→ellipsoid conversion coastal pins
        # depend on.
        VITE_TERRAIN_URL: ${VITE_TERRAIN_URL:-}
        VITE_TERRAIN_CREDIT: ${VITE_TERRAIN_CREDIT:-}
        # Where "Add a photo or video" uploads to. Defaulted to the atlas-api
        # service's published address rather than left empty: the stack below
        # runs that API and MinIO, so an image built from this file that could
        # not reach them would be disabled against a store sitting next to it.
        # Must match ATLAS_CORS_ORIGINS on atlas-api from the other direction.
        VITE_ATLAS_API: ${VITE_ATLAS_API:-http://localhost:8787/api}
    ports:
      # Container-side must be 8080: the viewer image serves the static bundle
      # with nginx `listen 8080` (see viewer-react/Dockerfile), matching the
      # port this app advertises to CI-Hub in hub/config.json and
      # hub/docker-compose.json. Host side is 4174, matching the viewer's dev
      # port and ATLAS_VIEWER_BASE_URL below.
      - "4174:8080"

  atlas-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "8787"
      ATLAS_VIEWER_BASE_URL: ${ATLAS_VIEWER_BASE_URL:-http://localhost:4174}
      ATLAS_API_BASE_URL: ${ATLAS_API_BASE_URL:-http://localhost:8787/api}
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: atlas
      # Without these the upload endpoint answers 503 "storage is not
      # configured" — honest, but not useful in a stack that ships MinIO. The
      # bucket named above must exist: MinIO does not create one on write.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-atlas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-atlas-secret}
      ATLAS_MAX_UPLOAD_BYTES: ${ATLAS_MAX_UPLOAD_BYTES:-33554432}
      # The viewer service below is a different origin from this one (:8080 vs
      # :8787), so the browser preflights every upload. Without this the file
      # picker works, the server is healthy, and nothing ever arrives.
      # localhost:4174 — the *host* port the viewer is published on above
      # (4174:8080). The browser's Origin is the address a person typed, not
      # the container's internal port, and getting that wrong fails only in the
      # browser, silently.
      ATLAS_CORS_ORIGINS: ${ATLAS_CORS_ORIGINS:-http://localhost:4174}
      # Suite + auth wiring (see .env.default)
      CI_MEMORY_URL: ${CI_MEMORY_URL:-}
      CI_MEMORY_API_KEY: ${CI_MEMORY_API_KEY:-}
      OPENCLAW_URL: ${OPENCLAW_URL:-}
      HERMES_URL: ${HERMES_URL:-}
      COMPANION_OIDC_ISSUER: ${COMPANION_OIDC_ISSUER:-}
      COMPANION_OIDC_AUDIENCE: ${COMPANION_OIDC_AUDIENCE:-}
    ports:
      - "8787:8787"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: atlas
    depends_on:
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  minio-data:
  pg-data:
