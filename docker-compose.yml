# Companion Atlas — containerized 3D processing server + web viewer.
#
#   viewer    static web viewer (nginx) — renders shared 4D stories
#   atlas-api 3D processing API + MCP server (REST + /mcp)
#   worker    GPU reconstruction worker (photogrammetry / gaussian splat)
#   minio     S3-compatible object store for media + generated 3D Tiles
#   postgres  story / scene / media metadata
#   redis     job queue (ingest → reconstruct → tile)
#
# Bring up the app tier (viewer + api + stores):
#   docker compose up viewer atlas-api minio postgres redis
# Add reconstruction (needs an NVIDIA GPU):
#   docker compose --profile gpu up worker

services:
  viewer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
        GOOGLE_MAP_PLATFORM: ${GOOGLE_MAP_PLATFORM:-}
        MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
        ESRI_API_KEY: ${ESRI_API_KEY:-}
    ports:
      - "4173:80"
    depends_on:
      - atlas-api

  atlas-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "8787"
      ATLAS_VIEWER_BASE_URL: ${ATLAS_VIEWER_BASE_URL:-http://localhost:4173}
      ATLAS_API_BASE_URL: ${ATLAS_API_BASE_URL:-http://localhost:8787/api}
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: atlas
      # Suite + auth wiring (see .env.default)
      CI_MEMORY_URL: ${CI_MEMORY_URL:-}
      OPENCLAW_URL: ${OPENCLAW_URL:-}
      HERMES_URL: ${HERMES_URL:-}
      COMPANION_OIDC_ISSUER: ${COMPANION_OIDC_ISSUER:-}
      COMPANION_OIDC_AUDIENCE: ${COMPANION_OIDC_AUDIENCE:-}
    ports:
      - "8787:8787"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: atlas
    depends_on:
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  minio-data:
  pg-data:
