<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Companion Earth Control Deck</title>
  </head>
  <body>
    <div id="layout">
      <aside id="control-panel">
        <h1>Companion Earth</h1>
        <p class="sub">Declarative Vibe Coding workflow</p>

        <section class="card">
          <h2>New Account</h2>
          <form id="account-form">
            <label for="account-name">Account Name</label>
            <input id="account-name" name="accountName" value="earth-operator" maxlength="48" />
            <button type="submit">Create Account Session</button>
          </form>
          <p id="account-status" aria-live="polite"></p>
        </section>

        <section class="card">
          <h2>Workflow Steps</h2>
          <ul id="workflow-list"></ul>
        </section>

        <section class="card">
          <h2>Spatial Scrapbook</h2>
          <form id="scrapbook-form">
            <label for="pin-label">Pin Label</label>
            <input id="pin-label" name="pinLabel" value="New Memory" maxlength="64" />
            <button type="submit">Drop Pin At Viewpoint</button>
          </form>
          <ul id="pin-list"></ul>
        </section>

        <section class="card">
          <h2>Pin Details</h2>
          <form id="pin-detail-form">
            <label for="pin-detail-label">Label</label>
            <input id="pin-detail-label" name="pinDetailLabel" maxlength="64" />

            <label for="pin-detail-notes">Notes</label>
            <textarea id="pin-detail-notes" name="pinDetailNotes" rows="3"></textarea>

            <label for="pin-detail-media-url">Media URL</label>
            <input id="pin-detail-media-url" name="pinDetailMediaUrl" placeholder="https://..." />

            <button type="submit">Save Metadata</button>
          </form>
          <div class="row-actions">
            <button id="pin-fly-btn" type="button">Fly To Pin</button>
            <button id="pin-delete-btn" type="button">Delete Pin</button>
          </div>
        </section>

        <section class="card">
          <h2>Journeys</h2>
          <div class="row-actions">
            <button id="journey-start-btn" type="button">Play Journey</button>
            <button id="journey-next-btn" type="button">Next Stop</button>
            <button id="journey-stop-btn" type="button">Stop</button>
          </div>
          <p id="journey-status">Journey idle.</p>
        </section>
      </aside>

      <main id="viewport">
        <div id="app"></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
