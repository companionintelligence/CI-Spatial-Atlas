[package]
name = "companion-atlas-desktop"
version = "0.1.0"
description = "Companion Atlas desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.12.5", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
