<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Companion Atlas</title>
    <meta name="description" content="Companion Atlas is a 3D XR globe to review and plan your travels. Open a story on a 3D globe in the browser, or step into it in WebXR." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://atlas.ci.computer/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Companion Intelligence" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Companion Atlas" />
    <meta property="og:description" content="Review and plan your travels on a 3D globe, in the browser or in WebXR." />
    <meta property="og:url" content="https://atlas.ci.computer/" />
    <meta property="og:image" content="https://atlas.ci.computer/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Companion Atlas: the globe mark on a dark teal background, with the headline Review and plan your travels in 3D." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Companion Atlas" />
    <meta name="twitter:description" content="Review and plan your travels on a 3D globe, in the browser or in WebXR." />
    <meta name="twitter:image" content="https://atlas.ci.computer/og-image.png" />
    <meta name="twitter:image:alt" content="Companion Atlas: the globe mark on a dark teal background, with the headline Review and plan your travels in 3D." />
    <!-- Installable as an app (public/manifest.webmanifest has display: standalone).
         #041620 is the canon dark background the app paints (--teal-950): the colour of the
         title bar or status bar around the globe, and of the splash screen before it. -->
    <meta name="theme-color" content="#041620" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <style>@keyframes atlas-boot-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }</style>
    <!-- Structured data. A data block, not a script that runs, so it needs no CSP allowance.
         Only facts from the README and the app itself: no price, no rating, no availability. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ci.computer/#organization",
            "name": "Companion Intelligence",
            "url": "https://ci.computer/"
          },
          {
            "@type": "WebSite",
            "@id": "https://atlas.ci.computer/#website",
            "name": "Companion Atlas",
            "url": "https://atlas.ci.computer/",
            "inLanguage": "en",
            "publisher": { "@id": "https://ci.computer/#organization" }
          },
          {
            "@type": "WebPage",
            "@id": "https://atlas.ci.computer/#webpage",
            "name": "Companion Atlas",
            "url": "https://atlas.ci.computer/",
            "inLanguage": "en",
            "isPartOf": { "@id": "https://atlas.ci.computer/#website" },
            "about": { "@id": "https://atlas.ci.computer/#app" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://atlas.ci.computer/#app",
            "name": "Companion Atlas",
            "url": "https://atlas.ci.computer/",
            "applicationCategory": "TravelApplication",
            "operatingSystem": "Any modern web browser",
            "description": "Companion Atlas is a 3D XR globe to review and plan your travels. Open a story on a 3D globe in the browser, or step into it in WebXR.",
            "image": "https://atlas.ci.computer/og-image.png",
            "publisher": { "@id": "https://ci.computer/#organization" },
            "sameAs": ["https://github.com/companionintelligence/CI-Spatial-Atlas"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Painted before the bundle loads, so a slow connection shows the app, not a blank page.
           React replaces this when the app mounts. Same drawing as the in-app BootScreen. -->
      <div class="atlas-boot" role="status" style="position:fixed;inset:0;display:grid;place-items:center;background:#041620;color:#8fb3b8;font:500 14px/1.4 Manrope,'Avenir Next',system-ui,sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
          <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true" style="animation:atlas-boot-breathe 2.4s ease-in-out infinite"><defs><linearGradient id="atlas-bm-boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#066c80"/><stop offset=".55" stop-color="#00a9a7"/><stop offset="1" stop-color="#72ddd4"/></linearGradient></defs><g fill="none" stroke="url(#atlas-bm-boot)" stroke-width="6" stroke-linecap="round"><circle cx="50" cy="50" r="46"/><ellipse cx="50" cy="50" rx="21" ry="46"/><line x1="4" y1="50" x2="96" y2="50"/><line x1="13" y1="28" x2="87" y2="28"/><line x1="13" y1="72" x2="87" y2="72"/></g></svg>
          <span>Loading Companion Atlas…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
