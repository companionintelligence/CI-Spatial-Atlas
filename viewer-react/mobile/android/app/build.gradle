apply plugin: 'com.android.application'

// The version numbers come from ios/version.xcconfig, the one file both store builds read:
// MARKETING_VERSION becomes versionName and CURRENT_PROJECT_VERSION becomes versionCode.
def atlasVersionConfig = rootProject.file('../ios/version.xcconfig').text
def atlasVersionName = (atlasVersionConfig =~ /(?m)^MARKETING_VERSION\s*=\s*(\S+)/)[0][1]
def atlasVersionCode = Integer.parseInt((atlasVersionConfig =~ /(?m)^CURRENT_PROJECT_VERSION\s*=\s*(\d+)/)[0][1])

// Upload signing. Each value comes from a Gradle property (-P, gradle.properties, or
// ORG_GRADLE_PROJECT_<name> in the environment) or from an environment variable of the same name.
// Nothing is committed. Without ATLAS_UPLOAD_STORE_FILE the release build is produced unsigned,
// and that is what the CI debug job and the local checks use.
def atlasSigning = { String name -> findProperty(name) ?: System.getenv(name) }
def atlasUploadStore = atlasSigning('ATLAS_UPLOAD_STORE_FILE')
def atlasUploadSigned = atlasUploadStore != null && atlasUploadStore.toString().trim() != ''

android {
    namespace = "com.companionintelligence.atlas"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.companionintelligence.atlas"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode atlasVersionCode
        versionName atlasVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (atlasUploadSigned) {
                storeFile file(atlasUploadStore)
                storePassword atlasSigning('ATLAS_UPLOAD_STORE_PASSWORD')
                keyAlias atlasSigning('ATLAS_UPLOAD_KEY_ALIAS')
                keyPassword atlasSigning('ATLAS_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 shrinks and obfuscates the release build. Capacitor's rules come in through its
            // consumer ProGuard file; the app's own rules are in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (atlasUploadSigned) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
